    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background:
                radial-gradient(circle at 20% 20%, rgba(120, 80, 180, 0.22), transparent 28%),
                radial-gradient(circle at 80% 15%, rgba(255, 160, 60, 0.18), transparent 24%),
                linear-gradient(180deg, #09070f 0%, #05070b 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        canvas {
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            box-shadow:
                0 0 0 1px rgba(255,255,255,0.08),
                0 24px 70px rgba(0,0,0,0.55),
                0 0 80px rgba(120, 90, 180, 0.12);
            border-radius: 10px;
        }
    </style>
